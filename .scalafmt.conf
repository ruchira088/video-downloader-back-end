version = 3.11.5
runner.dialect = scala3
preset = IntelliJ
maxColumn = 120
align.preset = none
# Rewrite Scala 2 syntax that Scala 3 deprecates: `import a.*`, `import a.{b as c}`, `?` type wildcards, `xs*` varargs.
# Control structures keep their parentheses, and braces stay.
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.newSyntax.control = false
