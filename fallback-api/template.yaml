AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Fallback Video API - API to handle fallback requests when the video API is unavailable

Parameters:
  Stage:
    Type: String
    Description: Deployment stage
  DomainName:
    Type: String
    Description: Custom domain name (e.g. fallback-api.video.ruchij.com)
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 Hosted Zone ID
    Default: Z1LYXU4HVSANEL
  VideoDownloaderApiUrl:
    Type: String
    Description: URL of the video downloader API
  AlarmEmail:
    Type: String
    Description: Optional e-mail address notified when a sync dead-letter queue receives messages
    Default: ""

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Globals:
  Function:
    # SyncApplier's LOCK_DURATION (2 minutes) must outlive this, so a lock only expires once its
    # holder can no longer be writing.
    Timeout: 30
    Runtime: python3.14
    # Graviton: about 20% cheaper than x86_64 per GB-second
    Architectures:
      - arm64
    Environment:
      Variables:
        STAGE: !Ref Stage
        SCHEDULED_VIDEOS_TABLE_NAME: !Ref ScheduledVideosTable
        FALLBACK_TO_MAIN_QUEUE_URL: !Ref FallbackToMainQueue
  Api:
    # Throttles for the whole stage, shared by every caller (they are not per client): well above
    # what the few users of the fallback need, but far below the account's default of 10,000
    # requests a second, so a flood can't run up the Lambda, Cognito and DynamoDB bill or starve
    # other APIs in the account.
    MethodSettings:
      - ResourcePath: "/*"
        HttpMethod: "*"
        ThrottlingRateLimit: 50
        ThrottlingBurstLimit: 100
      # Sign-up is unauthenticated and makes two main-API calls and several Cognito admin calls
      # per request, and a client only calls it after a main-API login, so it is held much
      # lower. It needs its own resource and method (the UserSignUp event) to be throttled
      # apart from /{proxy+}. ResourcePath encodes the path's "/user" as "/~1user".
      - ResourcePath: "/~1user"
        HttpMethod: "POST"
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Stage}-fallback-api"
      Handler: handler.handler
      CodeUri: .
      MemorySize: 256
      LoggingConfig:
        LogGroup: !Ref ApiFunctionLogGroup
      Environment:
        Variables:
          AWS_COGNITO_USER_POOL_ID: !Ref UserPool
          AWS_COGNITO_CLIENT_ID: !Ref UserPoolClient
          VIDEO_DOWNLOADER_API_URL: !Ref VideoDownloaderApiUrl
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt FallbackToMainQueue.QueueName
        - Statement:
            # Only what DynamoDbSchedulingService calls: it lists videos and pending requests
            # (Query, on the table and on GSI1 for admins) and stores pending requests (PutItem).
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !GetAtt ScheduledVideosTable.Arn
                - !Sub "${ScheduledVideosTable.Arn}/index/GSI1"
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt ScheduledVideosTable.Arn
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminDeleteUser
                - cognito-idp:DescribeUserPoolClient
              Resource: !GetAtt UserPool.Arn
      Events:
        # Served by /{proxy+} too, but its own resource lets Globals.Api throttle it apart.
        UserSignUp:
          Type: Api
          Properties:
            Path: /user
            Method: POST
        RootPath:
          Type: Api
          Properties:
            Path: /
            Method: ANY
        ProxyPath:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY

  SyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Stage}-fallback-api-sync"
      Handler: sync_handler.handler
      CodeUri: .
      MemorySize: 256
      LoggingConfig:
        LogGroup: !Ref SyncFunctionLogGroup
      Environment:
        Variables:
          AWS_COGNITO_USER_POOL_ID: !Ref UserPool
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ScheduledVideosTable
        # Applies UserRevocation messages (src/sync/user_revoker.py): looks the user up, and
        # deletes their account, so the old password and tokens stop working.
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminDeleteUser
              Resource: !GetAtt UserPool.Arn
      Events:
        MainToFallback:
          Type: SQS
          Properties:
            Queue: !GetAtt MainToFallbackQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/fallback-api/${Stage}/api"
      RetentionInDays: 14

  SyncFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/fallback-api/${Stage}/sync"
      RetentionInDays: 14

  ScheduledVideosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Stage}-fallback-scheduled-videos"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  MainToFallbackDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  MainToFallbackQueue:
    Type: AWS::SQS::Queue
    Properties:
      # 4 days. A dead-lettered message keeps its original enqueue time, so the DLQ's 14-day
      # retention still leaves it at least 10 days there. The whole 14 days bounds how long any
      # message can be redriven, which the 15-day tombstone TTL (src/sync/items.py) outlives.
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MainToFallbackDeadLetterQueue.Arn
        maxReceiveCount: 5

  FallbackToMainDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  FallbackToMainQueue:
    Type: AWS::SQS::Queue
    Properties:
      # 14 days, which the pending items' 14-day ttl (PENDING_TTL) is tied to.
      MessageRetentionPeriod: 1209600
      VisibilityTimeout: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FallbackToMainDeadLetterQueue.Arn
        maxReceiveCount: 5

  SyncAlarmTopic:
    Type: AWS::SNS::Topic

  SyncAlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref SyncAlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  MainToFallbackDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Messages from the main API could not be applied to DynamoDB
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt MainToFallbackDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SyncAlarmTopic

  FallbackToMainDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Schedule requests could not be processed by the main API
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt FallbackToMainDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SyncAlarmTopic

  MainSideSyncUser:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: fallback-sync
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt MainToFallbackQueue.Arn
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                Resource: !GetAtt FallbackToMainQueue.Arn
              # The main side's reconcile scans only the sparse GSI1, which holds the live videos.
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !Sub "${ScheduledVideosTable.Arn}/index/GSI1"

  UserPool:
    Type: AWS::Cognito::UserPool
    # Losing the pool would make every user sign up again, so never delete or replace it.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${Stage}-fallback-api"
      DeletionProtection: ACTIVE
      Schema:
        - AttributeDataType: String
          Mutable: false
          Name: user_id
        - AttributeDataType: String
          Mutable: true
          Name: role
      # The main API enforces no password rules of its own, so this pool's policy must accept
      # whatever password a user already has there -- Cognito's stricter defaults would reject
      # many existing passwords. This is already as loose as Cognito allows: 6 is its lowest
      # MinimumLength, and it always rejects a password with leading or trailing whitespace,
      # whatever the policy. Sign-up answers either rejection with a 400 (user_service.py).
      Policies:
        PasswordPolicy:
          MinimumLength: 6
          RequireUppercase: false
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      # Sign-up only happens through the fallback API's admin calls (AdminCreateUser), never the
      # public SignUp API.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${Stage}-fallback-api-client"
      GenerateSecret: true
      # Answer a login for an unknown email like a wrong password, so logins can't probe which
      # emails have signed up.
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      WriteAttributes:
        - email
        - given_name
        - family_name

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  ApiDomainName:
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName: !Ref DomainName
      RegionalCertificateArn: !Ref Certificate
      EndpointConfiguration:
        Types:
          - REGIONAL

  ApiBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    DependsOn: ServerlessRestApiProdStage
    Properties:
      DomainName: !Ref ApiDomainName
      RestApiId: !Ref ServerlessRestApi
      Stage: Prod

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiDomainName.RegionalDomainName
        HostedZoneId: !GetAtt ApiDomainName.RegionalHostedZoneId

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  CustomDomainUrl:
    Description: Custom domain URL
    Value: !Sub "https://${DomainName}/"
  ScheduledVideosTableName:
    Description: DynamoDB table holding the scheduled video copy (FALLBACK_SYNC_TABLE_NAME on the main side)
    Value: !Ref ScheduledVideosTable
  MainToFallbackQueueUrl:
    Description: Queue the main API sends sync messages to (FALLBACK_SYNC_MAIN_TO_FALLBACK_QUEUE_URL)
    Value: !Ref MainToFallbackQueue
  FallbackToMainQueueUrl:
    Description: Queue the main API polls for schedule requests (FALLBACK_SYNC_FALLBACK_TO_MAIN_QUEUE_URL)
    Value: !Ref FallbackToMainQueue
  MainSideSyncUserName:
    Description: IAM user for the main API; create its access keys by hand
    Value: !Ref MainSideSyncUser
