apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: "{{ k8s_namespace }}"
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      branch: "{{ git_branch }}"
  template:
    metadata:
      labels:
        app: postgres
        branch: "{{ git_branch }}"
    spec:
      # Start as the image's postgres user (UID 999) so docker-entrypoint.sh skips its gosu
      # privilege drop. After a node reboot on 2026-11-10, gosu hung at 100% CPU before
      # exec'ing Postgres, so the startup probe kept restarting the pod and the batch app crash-looped.
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres-container
          image: postgres:17
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - configMapRef:
                name: postgres-config-map
            - secretRef:
                name: postgres-secrets
          ports:
            - name: postgres-port
              containerPort: 5432
          readinessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          livenessProbe:
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          startupProbe:
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
