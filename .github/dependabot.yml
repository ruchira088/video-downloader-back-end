version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "GitHub Actions:"

  - package-ecosystem: pip
    directory: /fallback-api
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "fallback-api:"
