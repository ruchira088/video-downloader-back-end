http-configuration {
  host = "0.0.0.0"
  host = ${?HTTP_HOST}

  port = 8000
  port = ${?HTTP_PORT}

  allowed-origins = "*.localhost;*.ruchij.com;192.168.*.*;10.*.*.*;172.*.*.*"
  allowed-origins = ${?HTTP_ALLOWED_ORIGINS}
}

storage-configuration {
  image-folder = "./images"
  image-folder = ${?IMAGE_FOLDER}

  video-folder = "./videos"
  video-folder = ${?VIDEO_FOLDER}

  other-video-folders = ""
  other-video-folders = ${?OTHER_VIDEO_FOLDERS}
}

database-configuration {
  url = "jdbc:h2:mem:video-downloader;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false"
  url = ${?DATABASE_URL}

  user = ""
  user = ${?DATABASE_USER}

  password = ""
  password = ${?DATABASE_PASSWORD}
}

redis-configuration {
  hostname = "localhost"
  hostname = ${?REDIS_HOSTNAME}

  port = 6379
  port = ${?REDIS_PORT}

  password = ""
  password = ${?REDIS_PASSWORD}
}

authentication-configuration {
  session-duration = "30 days"
  session-duration = ${?SESSION_DURATION}
}

pubsub-configuration {
  type = "kafka"
  type = ${?PUBSUB_TYPE}

  kafka-configuration {
    prefix = "local"
    prefix = ${?KAFKA_PREFIX}

    bootstrap-servers = ${?KAFKA_BROKERS}

    schema-registry = ${?SCHEMA_REGISTRY}
  }

  redis-configuration {
    hostname = "localhost"
    hostname = ${?REDIS_HOSTNAME}

    port = 6379
    port = ${?REDIS_PORT}

    password = ""
    password = ${?REDIS_PASSWORD}
  }

  database-configuration {
    url = "jdbc:h2:mem:video-downloader;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false"
    url = ${?DATABASE_URL}

    user = ""
    user = ${?DATABASE_USER}

    password = ""
    password = ${?DATABASE_PASSWORD}
  }
}

spa-site-renderer-configuration {
  uri = ${SPA_SITE_RENDERER}
}

sentry-configuration {
  dsn = ${?SENTRY_DSN}

  environment = "development"
  environment = ${?SENTRY_ENVIRONMENT}

  traces-sample-rate = 1.0
  traces-sample-rate = ${?SENTRY_TRACES_SAMPLE_RATE}
}

http-proxy-configuration {
  proxy-url = ${?HTTP_PROXY_URL}
}

fallback-sync-configuration {
  enabled = false
  enabled = ${?FALLBACK_SYNC_ENABLED}

  main-to-fallback-queue-url = ${?FALLBACK_SYNC_MAIN_TO_FALLBACK_QUEUE_URL}
  fallback-to-main-queue-url = ${?FALLBACK_SYNC_FALLBACK_TO_MAIN_QUEUE_URL}
  table-name = ${?FALLBACK_SYNC_TABLE_NAME}
  aws-region = ${?FALLBACK_SYNC_AWS_REGION}
  aws-endpoint-url = ${?FALLBACK_SYNC_AWS_ENDPOINT_URL}
}